name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt ruff

      - name: Lint
        run: ruff check backend/app backend/scripts backend/tests

      - name: Init database
        run: python backend/scripts/init_db.py

      - name: Run tests
        run: |
          cd backend
          pytest -v
